name: Release extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const readJson = (path) => JSON.parse(readFileSync(path, 'utf8'));
          const tag = process.env.RELEASE_TAG;
          assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Use a tag like v1.0.0');
          const version = tag.slice(1);
          assert.ok(version.split('.').every((part) => Number(part) <= 65535) && version !== '0.0.0', 'Invalid extension version');
          for (const path of ['public/manifest.json', 'package.json', 'package-lock.json']) {
            assert.equal(readJson(path).version, version, `${path} must match ${tag}`);
          }
          assert.equal(readJson('package-lock.json').packages[''].version, version, 'Lockfile root version must match the tag');
          console.log(`Releasing ${tag}`);
          NODE

      - run: npm ci

      - name: Test background logic
        run: node --test tests/background.test.js

      - name: Build extension
        run: npm run build

      - name: Package extension
        working-directory: dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -f manifest.json
          test -f background.js
          test -f index.html
          zip -r "../proxy-extension-${RELEASE_TAG}.zip" .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "proxy-extension-${RELEASE_TAG}.zip" \
            --verify-tag \
            --title "Proxy Extension ${RELEASE_TAG}" \
            --generate-notes
